name: Verify teaching examples

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate project from the lessons
        run: python3 .github/scripts/prepare-exercises.py "$RUNNER_TEMP/orders"
      - name: Test the order API with H2 and PostgreSQL
        run: mvn --batch-mode --file "$RUNNER_TEMP/orders/pom.xml" test

  rfc9457:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate task service from the lesson
        run: python3 .github/scripts/prepare-exercises.py "$RUNNER_TEMP/rfc9457" --lesson rfc9457
      - name: Test atomic task completion
        run: mvn --batch-mode --file "$RUNNER_TEMP/rfc9457/pom.xml" test

  security-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate project and browser tests from the lessons
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/mikoto2000/spring-boot-security-handson/releases/download/v1.0.0/spring-boot-security-workshop-base.zip \
            --output "$RUNNER_TEMP/security-base.zip"
          python3 .github/scripts/prepare-exercises.py "$RUNNER_TEMP/security" \
            --security-zip "$RUNNER_TEMP/security-base.zip"
      - name: Package the Security app
        working-directory: ${{ runner.temp }}/security/spring-boot-security-workshop-base
        run: bash ./mvnw --batch-mode package
      - name: Test login, signup and logout in Chromium
        working-directory: ${{ runner.temp }}/security/spring-boot-security-workshop-base/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.ci.config.ts
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ runner.temp }}/security/spring-boot-security-workshop-base/e2e/playwright-report
