name: Verify teaching examples

on:
  workflow_call:

permissions:
  contents: read

jobs:
  orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate project from the lessons
        run: python3 .github/scripts/prepare-exercises.py "$RUNNER_TEMP/orders"
      - name: Test the order API with H2 and PostgreSQL
        run: mvn --batch-mode --file "$RUNNER_TEMP/orders/pom.xml" -DfailIfNoTests=true test

  rfc9457:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate task service from the lesson
        run: python3 .github/scripts/prepare-exercises.py "$RUNNER_TEMP/rfc9457" --lesson rfc9457
      - name: Test atomic task completion
        run: mvn --batch-mode --file "$RUNNER_TEMP/rfc9457/pom.xml" -DfailIfNoTests=true test

  web-lessons:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lesson: [shipping, retry, cache, security-tests, project-create, validation, testing, test-design, tdd, validation-tests, logging, migration, errors, scheduling]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate project from the lesson
        run: python3 .github/scripts/prepare-exercises.py "$RUNNER_TEMP/lesson" --lesson "${{ matrix.lesson }}"
      - name: Test HTTP behavior, caching or access control
        run: mvn --batch-mode --file "$RUNNER_TEMP/lesson/pom.xml" -DfailIfNoTests=true test

  redis-cache:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate Redis cache project from the lesson
        run: python3 .github/scripts/prepare-exercises.py "$RUNNER_TEMP/lesson" --lesson redis-cache
      - name: Test cache eviction and expiration with Redis
        run: >-
          mvn --batch-mode --file "$RUNNER_TEMP/lesson/pom.xml"
          -Dspring.data.redis.port=${{ job.services.redis.ports[6379] }} -DfailIfNoTests=true test

  session:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate session project from the lesson
        run: python3 .github/scripts/prepare-exercises.py "$RUNNER_TEMP/session" --lesson session
      - name: Test shared sessions and invalidation with Redis
        run: >-
          mvn --batch-mode --file "$RUNNER_TEMP/session/pom.xml"
          -Dspring.data.redis.port=${{ job.services.redis.ports[6379] }} -DfailIfNoTests=true test

  actuator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate Actuator project from the lessons
        run: python3 .github/scripts/prepare-exercises.py "$RUNNER_TEMP/actuator" --lesson actuator
      - name: Test database health and HTTP metrics with PostgreSQL
        run: mvn --batch-mode --file "$RUNNER_TEMP/actuator/pom.xml" -DfailIfNoTests=true test

  security-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate project and browser tests from the lessons
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/mikoto2000/spring-boot-security-handson/releases/download/v1.0.0/spring-boot-security-workshop-base.zip \
            --output "$RUNNER_TEMP/security-base.zip"
          python3 .github/scripts/prepare-exercises.py "$RUNNER_TEMP/security" \
            --security-zip "$RUNNER_TEMP/security-base.zip"
      - name: Package the Security app
        working-directory: ${{ runner.temp }}/security/spring-boot-security-workshop-base
        run: bash ./mvnw --batch-mode -DfailIfNoTests=true package
      - name: Test login, signup and logout in Chromium
        working-directory: ${{ runner.temp }}/security/spring-boot-security-workshop-base/e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.ci.config.ts
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ runner.temp }}/security/spring-boot-security-workshop-base/e2e/playwright-report
