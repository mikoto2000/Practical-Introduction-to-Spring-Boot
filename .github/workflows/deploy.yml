name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exercises:
    permissions:
      contents: read
    uses: ./.github/workflows/exercises.yml

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci

    - name: Check teaching material
      run: npm run textlint

    - name: Lint
      run: npm run lint

    - name: Check with Biome
      run: npm run check

    - name: Check types and chapter navigation
      run: |
        npm run typecheck
        npm run check:chapters

    - name: Test exercise generation safeguards
      run: python3 -m unittest discover -s .github/scripts/tests

    - name: Build project
      env:
        GA_ID: ${{ vars.GA_ID }}
      run: npm run build

    - name: Upload artifact
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./doc_build

  deploy:
    if: github.event_name == 'push'
    needs: [build, exercises]
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Check this revision is still current
      id: revision
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
        if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "Skipping outdated revision $GITHUB_SHA; main is $latest_sha"
        fi

    - name: Deploy to GitHub Pages
      id: deployment
      if: steps.revision.outputs.current == 'true'
      uses: actions/deploy-pages@v4
