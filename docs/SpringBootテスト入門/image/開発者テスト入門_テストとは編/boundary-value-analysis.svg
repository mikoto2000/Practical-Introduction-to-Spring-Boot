<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
  <title id="title">年齢の境界値分析</title>
  <desc id="desc">下限0の周辺は-1が不正、0と1が妥当。上限120の周辺は119と120が妥当、121が不正。境界とその前後の6つの値を選ぶ。</desc>
  <rect width="960" height="490" rx="16" fill="#ffffff"/>
  <g font-family="'Noto Sans JP', 'Noto Sans CJK JP', 'Yu Gothic', sans-serif">
<text x="40" y="48" font-size="28" text-anchor="start" font-weight="bold" fill="#172b3a">境界値分析：境界と、その前後を選ぶ</text>
<text x="40" y="85" font-size="21" text-anchor="start" font-weight="normal" fill="#172b3a">仕様：整数の年齢が 0～120 なら妥当（両端を含む）</text>
<rect x="40" y="114" width="415" height="260" rx="12" fill="#f8fafb" stroke="#c2ccd3" stroke-width="2"/>
<text x="247.5" y="151" font-size="24" text-anchor="middle" font-weight="bold" fill="#172b3a">下限 0 の周辺</text>
<rect x="63" y="176" width="104" height="109" rx="12" fill="#fff1e8" stroke="#c2ccd3" stroke-width="2"/>
<text x="115" y="218" font-size="30" text-anchor="middle" font-weight="bold" fill="#172b3a">-1</text>
<text x="115" y="261" font-size="21" text-anchor="middle" font-weight="bold" fill="#172b3a">不正</text>
<text x="115" y="326" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b3a">最小 − 1</text>
<rect x="195" y="176" width="104" height="109" rx="12" fill="#e7f4f4" stroke="#c2ccd3" stroke-width="2"/>
<text x="247" y="218" font-size="30" text-anchor="middle" font-weight="bold" fill="#172b3a">0</text>
<text x="247" y="261" font-size="21" text-anchor="middle" font-weight="bold" fill="#172b3a">妥当</text>
<text x="247" y="326" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b3a">最小</text>
<rect x="327" y="176" width="104" height="109" rx="12" fill="#e7f4f4" stroke="#c2ccd3" stroke-width="2"/>
<text x="379" y="218" font-size="30" text-anchor="middle" font-weight="bold" fill="#172b3a">1</text>
<text x="379" y="261" font-size="21" text-anchor="middle" font-weight="bold" fill="#172b3a">妥当</text>
<text x="379" y="326" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b3a">最小 ＋ 1</text>
<rect x="505" y="114" width="415" height="260" rx="12" fill="#f8fafb" stroke="#c2ccd3" stroke-width="2"/>
<text x="712.5" y="151" font-size="24" text-anchor="middle" font-weight="bold" fill="#172b3a">上限 120 の周辺</text>
<rect x="528" y="176" width="104" height="109" rx="12" fill="#e7f4f4" stroke="#c2ccd3" stroke-width="2"/>
<text x="580" y="218" font-size="30" text-anchor="middle" font-weight="bold" fill="#172b3a">119</text>
<text x="580" y="261" font-size="21" text-anchor="middle" font-weight="bold" fill="#172b3a">妥当</text>
<text x="580" y="326" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b3a">最大 − 1</text>
<rect x="660" y="176" width="104" height="109" rx="12" fill="#e7f4f4" stroke="#c2ccd3" stroke-width="2"/>
<text x="712" y="218" font-size="30" text-anchor="middle" font-weight="bold" fill="#172b3a">120</text>
<text x="712" y="261" font-size="21" text-anchor="middle" font-weight="bold" fill="#172b3a">妥当</text>
<text x="712" y="326" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b3a">最大</text>
<rect x="792" y="176" width="104" height="109" rx="12" fill="#fff1e8" stroke="#c2ccd3" stroke-width="2"/>
<text x="844" y="218" font-size="30" text-anchor="middle" font-weight="bold" fill="#172b3a">121</text>
<text x="844" y="261" font-size="21" text-anchor="middle" font-weight="bold" fill="#172b3a">不正</text>
<text x="844" y="326" font-size="19" text-anchor="middle" font-weight="normal" fill="#172b3a">最大 ＋ 1</text>
<text x="480" y="417" font-size="24" text-anchor="middle" font-weight="bold" fill="#172b3a">選ぶ値：-1、0、1、119、120、121</text>
<text x="480" y="456" font-size="21" text-anchor="middle" font-weight="normal" fill="#172b3a">0 と 120 を受け付け、-1 と 121 を拒むことを確認する</text>
  </g>
</svg>
